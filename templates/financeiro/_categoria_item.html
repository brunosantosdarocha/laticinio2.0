{% comment %} Uma linha da lista de categorias. {% endcomment %}
<li class="list-group-item d-flex justify-content-between align-items-center">
  <span class="{% if not c.ativa %}text-body-secondary text-decoration-line-through{% endif %}">{{ c.nome }}
    {% if c.sistema %}<span class="badge text-bg-info ms-1">automática</span>{% endif %}
    {% if not c.ativa %}<span class="badge text-bg-secondary ms-1">inativa</span>{% endif %}</span>
  {% if perms.financeiro.change_categoria and not c.sistema %}<a href="{% url 'financeiro:categoria_editar' c.pk %}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>{% endif %}
</li>
